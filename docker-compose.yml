services:
  cowrie:
    build:
      context: .
      dockerfile: docker/Dockerfile.cowrie
    container_name: cyvantis-cowrie-honeypot
    ports:
      - "2222:2222"
      - "2223:2223"
    volumes:
      - cowrie-logs:/cowrie/var/log/cowrie
    restart: always

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: cyvantis-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/cyvantis.db
      - COWRIE_LOG_PATH=/cowrie_logs/cowrie.json
      - SIMULATION_MODE=${SIMULATION_MODE:-false}
      - SECRET_KEY=${SECRET_KEY:-cyvantis_super_secret_jwt_key_2026_soc_enterprise_mode_secure}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - NVD_API_KEY=${NVD_API_KEY:-}
      - BACKUP_DIR=./backups
    volumes:
      - sqlite-data:/app/data
      - backup-data:/app/backups
      - cowrie-logs:/cowrie_logs:ro
    depends_on:
      - cowrie
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: cyvantis-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

volumes:
  sqlite-data:
  backup-data:
  cowrie-logs:
